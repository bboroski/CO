name: CO to SaintSI adapter smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bboroski/SaintSI
          ref: main
          path: deps/SaintSI
      - name: Compile optional observer bridge against provider headers
        run: |
          printf '%s\n' '#include "co/saintsi_bridge.h"' 'int main(void) { return 0; }' | cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I include -I deps/SaintSI/include -x c -

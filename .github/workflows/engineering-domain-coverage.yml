name: Engineering Domain Coverage
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-coverage:
    name: Validate engineering areas
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the auditor
        run: python tools/domain_coverage_audit.py --self-test
      - name: Verify declared capabilities and evidence
        run: python tools/domain_coverage_audit.py --format markdown

name: CO E2K native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2k-native:
    runs-on: [self-hosted, linux, e2k]
    steps:
      - uses: actions/checkout@v4
      - name: Verify E2K host and LCC
        run: |
          test "$(uname -m)" = "e2k"
          command -v lcc
          lcc --version
      - name: Build and execute CO tests with LCC
        run: make clean test CC=lcc
